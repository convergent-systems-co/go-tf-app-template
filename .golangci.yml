version: "2"

linters:
  default: standard
  enable:
    - errcheck
    - gosec
    - gocyclo
    - revive
    - misspell
    - unparam
    - unused

linters-settings:
  gocyclo:
    min-complexity: 15
  revive:
    rules:
      - name: exported

issues:
  exclude-rules:
    - path: _test\.go
      linters: [errcheck, gosec, unparam]
